<!--
  ============================================================================
  L.A. TECHNISCHE SERVICE — Contactpagina
  Single-file HTML voor Elementor HTML-widget (WordPress)
  ============================================================================
  • Volledig zelfstandig — geen externe server, framework of build-stap nodig
  • Inline CSS (gescoped onder .lats-page) — geen conflict met Elementor
  • Native HTML-form POST naar Web3Forms — geen CORS-issues, werkt overal
  • Redirect terug naar dezelfde pagina met succes-melding
  • Volledig responsive (mobiel, tablet, desktop)
  ============================================================================
  HOE TE GEBRUIKEN: zie INSTALLATIE.md
  ============================================================================
-->

<style>
  /* ==== Google Fonts ==== */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap');

  /* ==== Scoped reset binnen .lats-page ==== */
  .lats-page,
  .lats-page *,
  .lats-page *::before,
  .lats-page *::after {
    box-sizing: border-box;
  }

  .lats-page {
    /* Brand colors */
    --lats-orange: #EE5A24;
    --lats-orange-hover: #f0651f;
    --lats-bg: #0a0a0a;
    --lats-card-bg: rgba(24, 24, 27, 0.6);
    --lats-card-border: rgba(255, 255, 255, 0.10);
    --lats-input-bg: rgba(255, 255, 255, 0.04);
    --lats-input-border: rgba(255, 255, 255, 0.10);
    --lats-text: #ffffff;
    --lats-muted: #9ca3af;
    --lats-muted-2: #d1d5db;

    position: relative;
    background:
      radial-gradient(circle at 20% -10%, rgba(238, 90, 36, 0.22), transparent 45%),
      radial-gradient(circle at 90% 110%, rgba(238, 90, 36, 0.18), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(238, 90, 36, 0.04), transparent 60%),
      var(--lats-bg);
    color: var(--lats-text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
    padding: 60px 24px 0;
    overflow: hidden;
  }

  /* ==== HERO ==== */
  .lats-hero {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
    padding-top: 30px;
  }
  .lats-logo-wrap {
    position: relative;
    display: inline-block;
  }
  .lats-logo-glow {
    position: absolute;
    inset: -48px;
    border-radius: 9999px;
    background: rgba(238, 90, 36, 0.15);
    filter: blur(48px);
    pointer-events: none;
  }
  .lats-logo {
    position: relative;
    height: 240px;
    width: auto;
    max-width: 90vw;
    display: block;
    margin: 0 auto;
  }
  @media (min-width: 640px) { .lats-logo { height: 320px; } }
  @media (min-width: 768px) { .lats-logo { height: 384px; } }
  @media (min-width: 1024px) { .lats-logo { height: 448px; } }

  .lats-eyebrow {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }
  @media (min-width: 640px) { .lats-eyebrow { font-size: 1.125rem; } }
  @media (min-width: 768px) { .lats-eyebrow { font-size: 1.25rem; } }
  .lats-eyebrow .rule {
    display: inline-block;
    width: 48px;
    height: 4px;
    background: var(--lats-orange);
    border-radius: 9999px;
  }
  .lats-eyebrow .o { color: var(--lats-orange); }
  .lats-eyebrow .w { color: #ffffff; }

  /* ==== CONTACT SECTION ==== */
  .lats-contact {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 0 80px;
  }
  @media (min-width: 768px) { .lats-contact { padding-top: 64px; } }

  .lats-contact-head {
    text-align: center;
    margin-bottom: 40px;
  }
  .lats-contact-head h2 {
    font-family: 'Poppins', 'Inter', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.01em;
    color: #ffffff;
    margin: 0;
    line-height: 1.1;
  }
  @media (min-width: 768px) { .lats-contact-head h2 { font-size: 2.25rem; } }
  .lats-contact-head p {
    margin: 12px 0 0;
    color: var(--lats-muted);
    font-size: 1rem;
  }

  .lats-card {
    background: var(--lats-card-bg);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: 1px solid var(--lats-card-border);
    border-radius: 16px;
    box-shadow: 0 30px 80px -25px rgba(238, 90, 36, 0.35);
    padding: 28px;
  }
  @media (min-width: 768px) { .lats-card { padding: 40px; } }

  .lats-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (min-width: 640px) { .lats-row { grid-template-columns: 1fr 1fr; } }

  .lats-field { margin-bottom: 20px; }
  .lats-field-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lats-muted);
    margin-bottom: 8px;
  }
  .lats-field-input {
    width: 100%;
    background: var(--lats-input-bg);
    border: 1px solid var(--lats-input-border);
    border-radius: 8px;
    padding: 14px 16px;
    color: #ffffff;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s;
  }
  .lats-field-input::placeholder { color: #6b7280; }
  .lats-field-input:focus {
    outline: none;
    border-color: var(--lats-orange);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 4px rgba(238, 90, 36, 0.18);
  }
  textarea.lats-field-input { resize: none; min-height: 140px; }

  /* ==== Submit button (gecentreerd) ==== */
  .lats-submit-wrap {
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lats-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--lats-orange);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 16px 32px;
    border-radius: 9999px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 240px;
    box-shadow: 0 8px 28px -6px rgba(238, 90, 36, 0.55);
    font-family: inherit;
    text-decoration: none;
  }
  .lats-submit:hover {
    background: var(--lats-orange-hover);
    transform: translateY(-1px);
    box-shadow: 0 14px 36px -8px rgba(238, 90, 36, 0.7);
  }
  .lats-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .lats-status {
    margin-top: 16px;
    text-align: center;
    font-size: 0.875rem;
    padding: 12px 16px;
    border-radius: 8px;
    display: none;
  }
  .lats-status.show { display: block; }
  .lats-status.success {
    color: #34d399;
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.2);
  }

  /* ==== Honeypot — verbergen voor mensen, vangt bots ==== */
  .lats-botcheck {
    position: absolute !important;
    left: -9999px !important;
    width: 1px !important;
    height: 1px !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* ==== FOOTER ==== */
  .lats-footer { background: #000000; }
  .lats-footer-bar {
    height: 8px;
    background: var(--lats-orange);
  }
  .lats-footer-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 28px;
  }
  .lats-footer-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  @media (min-width: 768px) {
    .lats-footer-row { justify-content: space-between; gap: 40px; }
    .lats-footer-inner { padding: 40px 24px 32px; }
  }
  .lats-footer-item {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    color: #e5e7eb;
    font-size: 0.9rem;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }
  .lats-footer-item.is-link:hover { color: var(--lats-orange); }
  .lats-footer-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: var(--lats-orange);
    border-radius: 6px;
    flex-shrink: 0;
  }
  .lats-footer-icon svg { width: 16px; height: 16px; color: #ffffff; }
  .lats-footer-copyright {
    text-align: center;
    color: #6b7280;
    font-size: 0.75rem;
    margin-top: 24px;
  }
</style>

<div class="lats-page" id="lats-top">

  <!-- ============== HERO: logo + slogan ============== -->
  <section class="lats-hero">
    <div class="lats-logo-wrap">
      <span class="lats-logo-glow"></span>
      <img class="lats-logo"
           src="https://ludoaloserij.nl/wp-content/uploads/2023/11/Color-logo-no-background-1024x627.png"
           alt="L.A. Technische Service">
    </div>
    <div class="lats-eyebrow">
      <span class="rule"></span>
      <span><span class="o">Alles met</span> <span class="w">Techniek</span></span>
      <span class="rule"></span>
    </div>
  </section>

  <!-- ============== CONTACT FORMULIER ============== -->
  <section class="lats-contact" id="lats-contact">
    <div class="lats-contact-head">
      <h2>Contact</h2>
      <p>Vul hieronder uw gegevens in</p>
    </div>

    <div class="lats-card">
      <!-- Native HTML form POST → Web3Forms (geen JS/CORS issues) -->
      <form action="https://api.web3forms.com/submit" method="POST" id="lats-form">
        <input type="hidden" name="access_key" value="980e58f0-c82a-4bb0-b33e-d1004e92b977">
        <input type="hidden" name="subject" value="Nieuw contactbericht via ludoaloserij.nl">
        <input type="hidden" name="from_name" value="L.A. Technische Service - Contactformulier">
        <!-- redirect URL wordt door JS hieronder gevuld zodat user terugkeert naar deze pagina -->
        <input type="hidden" name="redirect" id="lats-redirect" value="">

        <!-- Honeypot tegen bot-spam -->
        <input type="checkbox" name="botcheck" class="lats-botcheck" tabindex="-1" autocomplete="off">

        <div class="lats-row">
          <div>
            <label class="lats-field-label" for="lats-name">Volledige naam</label>
            <input class="lats-field-input" type="text" id="lats-name" name="name" placeholder="Jouw naam" required autocomplete="name">
          </div>
          <div>
            <label class="lats-field-label" for="lats-email">E-mail</label>
            <input class="lats-field-input" type="email" id="lats-email" name="email" placeholder="naam@voorbeeld.nl" required autocomplete="email">
          </div>
        </div>

        <div class="lats-field">
          <label class="lats-field-label" for="lats-subject">Onderwerp</label>
          <input class="lats-field-input" type="text" id="lats-subject" name="onderwerp" placeholder="Waar kan ik mee helpen?" required>
        </div>

        <div class="lats-field">
          <label class="lats-field-label" for="lats-message">Bericht</label>
          <textarea class="lats-field-input" id="lats-message" name="message" rows="6" placeholder="Vertel kort over je project, klus of vraag..." required></textarea>
        </div>

        <div class="lats-submit-wrap">
          <button type="submit" class="lats-submit" id="lats-submit-btn">
            <span>Verzenden</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.4.92V9.5l13 2.5L2 14.5v4.98a1 1 0 001.4.92z"/>
            </svg>
          </button>

          <div id="lats-status" class="lats-status success">
            Bericht verzonden — ik neem zo snel mogelijk contact op.
          </div>
        </div>
      </form>
    </div>
  </section>

  <!-- ============== FOOTER ============== -->
  <footer class="lats-footer">
    <div class="lats-footer-bar"></div>
    <div class="lats-footer-inner">
      <div class="lats-footer-row">
        <div class="lats-footer-item">
          <span class="lats-footer-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5z"/>
            </svg>
          </span>
          <span>Ludo Aloserij</span>
        </div>
        <a href="mailto:info@ludoaloserij.nl" class="lats-footer-item is-link">
          <span class="lats-footer-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </span>
          <span>info@ludoaloserij.nl</span>
        </a>
        <div class="lats-footer-item">
          <span class="lats-footer-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zM4 6h16v2H4V6zm6 4h2v8h-2v-8zm-4 0h2v8H6v-8zm8 0h2v8h-2v-8zm4 0h2v8h-2v-8z"/>
            </svg>
          </span>
          <span>KVK: 80568173</span>
        </div>
      </div>
      <div class="lats-footer-copyright">&copy; 2026 L.A. Technische Service &mdash; Alles met Techniek</div>
    </div>
  </footer>
</div>

<script>
  (function () {
    // 1) Vul redirect-URL in zodat user na verzenden terugkeert naar dezelfde pagina
    var redirectInput = document.getElementById('lats-redirect');
    if (redirectInput) {
      var url = window.location.origin + window.location.pathname + '?lats_sent=1#lats-contact';
      redirectInput.value = url;
    }

    // 2) Toon succes-melding wanneer user terugkeert van Web3Forms
    if (window.location.search.indexOf('lats_sent=1') !== -1) {
      var status = document.getElementById('lats-status');
      var form = document.getElementById('lats-form');
      if (status) status.classList.add('show');
      if (form) form.reset();

      // Scroll naar de bevestiging
      setTimeout(function () {
        var contact = document.getElementById('lats-contact');
        if (contact && contact.scrollIntoView) {
          contact.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 200);

      // Schoon de URL op (zonder reload) zodat refresh geen duplicate state geeft
      if (window.history && window.history.replaceState) {
        var clean = window.location.origin + window.location.pathname + '#lats-contact';
        window.history.replaceState({}, document.title, clean);
      }
    }
  })();
</script>
